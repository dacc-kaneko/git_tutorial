<!DOCTYPE html>
<html>
<head>
    <title>悪いHTMLのテスト</title>
    <style>
        /* インラインスタイルとCSSが混在 */
        body { margin: 0; }
        .container { width: 100%; }
    </style>
</head>
<body bgcolor="red" style="background-color: blue; padding: 10px;">
    <!-- セキュリティ上危険なコード -->
    <script>
        var userInput = prompt("名前を入力してください");
        document.write("<h1>こんにちは、" + userInput + "さん!</h1>");
        
        // パスワードが平文で記載
        var password = "admin123";
        var apiKey = "sk-1234567890abcdef";
        
        // 非推奨の関数を使用
        eval("console.log('危険な eval 使用');");
    </script>
    
    <!-- 構造的な問題 -->
    <div id="main" id="header" class="container" class="wrapper">
        <h1>メインタイトル
        <p>段落が閉じられていない
        <h2>サブタイトル</h1>
        
        <!-- アクセシビリティの問題 -->
        <img src="image.jpg" width="500">
        <a href="#" onclick="doSomething()">クリック</a>
        
        <!-- フォームの問題 -->
        <form>
            <input type="text" name="username">
            <input type="password" name="pwd">
            <input type="submit" value="送信" onclick="validateForm()">
        </form>
        
        <!-- テーブルの問題 -->
        <table>
            <tr>
                <td>名前</td>
                <td>年齢</td>
                <td>住所</td>
            </tr>
            <tr>
                <td>田中太郎
                <td>30</td>
                <td>東京都</td>
            </tr>
        </table>
        
        <!-- 意味のないタグ使用 -->
        <div>
            <span>
                <div>
                    <b><i><u>重複したスタイリング</u></i></b>
                </div>
            </span>
        </div>
        
        <!-- 不適切な文字エンコーディング -->
        <p>特殊文字テスト: &copy &reg &trade</p>
        
    <!-- 閉じタグが不適切 -->
    </div>
    
    <!-- インラインイベントハンドラー（非推奨） -->
    <button onclick="alert('インライン JavaScript は非推奨!')">ボタン</button>
    
    <!-- 廃止されたタグの使用 -->
    <center>
        <font color="green" size="5">古いHTMLタグを使用</font>
        <blink>点滅テキスト（非対応）</blink>
        <marquee>スクロールテキスト（非推奨）</marquee>
    </center>
    
    <script>
        // グローバル変数の乱用
        var globalVar1 = "危険";
        var globalVar2 = "セキュリティ";
        var globalVar3 = "問題";
        
        function validateForm() {
            // バリデーションが不適切
            return true;
        }
        
        function doSomething() {
            // エラーハンドリングなし
            var result = someUndefinedFunction();
            alert(result);
        }
        
        // XSS脆弱性
        document.getElementById("main").innerHTML = userInput;
    </script>
    
<!-- HTMLが適切に閉じられていない -->
</body>
